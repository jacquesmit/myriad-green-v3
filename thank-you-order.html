<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Thank You - Myriad Green</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:2rem;max-width:640px;margin:auto;}
    h1{color:#16a34a;}
    #message{margin-top:1rem;}
  </style>
</head>
<body>
  <h1>Thank you for your booking</h1>
  <p id="message">Checking payment status...</p>
  <script>
    (async function(){
      const params = new URLSearchParams(window.location.search);
      const sessionId = params.get('session_id');
      const msg = document.getElementById('message');
      if (!sessionId) {
        msg.textContent = 'No session information provided.';
        return;
      }
      try {
        const url = 'https://africa-south1-myriad-green-v3.cloudfunctions.net/verifyCheckoutSession?session_id=' + encodeURIComponent(sessionId);
        const resp = await fetch(url);
        const data = await resp.json();
        if (resp.ok && data.paid) {
          msg.textContent = 'Payment confirmed. Your booking has been logged successfully.';
        } else {
          msg.textContent = 'We were unable to verify payment. Please contact support if you believe this is an error.';
        }
      } catch (err) {
        msg.textContent = 'Error checking payment status. Please try again later or contact support.';
      }
    })();
  </script>
</body>
</html>
